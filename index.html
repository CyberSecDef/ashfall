<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ASHFALL</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Wordless rotate-device graphic, shown only in portrait. -->
    <div id="rotate" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="120" height="120">
        <g class="phone">
          <rect x="42" y="22" width="36" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="3" />
          <circle cx="60" cy="80" r="2.5" fill="currentColor" />
        </g>
        <path d="M30 96 A40 40 0 0 1 22 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M16 66 L22 58 L29 65" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <!-- The only words in the game: the title, fading in and out. -->
    <div id="title" aria-label="ASHFALL">ASHFALL</div>

    <div id="debug" hidden></div>
    <canvas id="pad-hint" aria-hidden="true"></canvas>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
